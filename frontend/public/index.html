<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InsightIQ – AI-Powered Business Intelligence Platform</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M3 3v18h18'/><path d='m19 9-5 5-4-4-3 3'/></svg>" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
            },
            darkBg: '#090d16',
            cardBg: '#0f172a',
            cardBorder: '#1e293b',
          }
        }
      }
    }
  </script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #090d16;
      color: #f8fafc;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100 antialiased selection:bg-indigo-500 selection:text-white overflow-hidden">
  <div id="root"></div>

  <!-- Main Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const API_BASE = '/api';

    // SVG Chart Helpers
    const SVGLineChart = ({ data, xKey = 'period', y1Key = 'revenue', y2Key = 'profit', title, subtitle }) => {
      if (!data || !data.length) return <div className="p-8 text-center text-slate-400 text-xs">No chart data</div>;
      const maxY = Math.max(...data.map(d => Math.max(d[y1Key] || 0, d[y2Key] || 0))) * 1.15 || 100;
      const width = 600;
      const height = 220;
      const padding = { top: 20, right: 30, bottom: 40, left: 60 };
      const chartW = width - padding.left - padding.right;
      const chartH = height - padding.top - padding.bottom;

      const pointsY1 = data.map((d, i) => {
        const x = padding.left + (i / (data.length - 1 || 1)) * chartW;
        const y = padding.top + chartH - ((d[y1Key] || 0) / maxY) * chartH;
        return `${x},${y}`;
      }).join(' ');

      const pointsY2 = data.map((d, i) => {
        const x = padding.left + (i / (data.length - 1 || 1)) * chartW;
        const y = padding.top + chartH - ((d[y2Key] || 0) / maxY) * chartH;
        return `${x},${y}`;
      }).join(' ');

      return (
        <div className="bg-[#0f172a] border border-slate-800/80 rounded-xl p-5 shadow-sm">
          <div className="flex items-center justify-between mb-2">
            <div>
              <h3 className="text-sm font-bold text-white">{title}</h3>
              {subtitle && <p className="text-xs text-slate-400">{subtitle}</p>}
            </div>
            <div className="flex items-center gap-3 text-xs">
              <span className="flex items-center gap-1.5 text-indigo-400 font-medium"><span className="w-2.5 h-2.5 rounded-full bg-indigo-500"></span> Revenue</span>
              <span className="flex items-center gap-1.5 text-emerald-400 font-medium"><span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Profit</span>
            </div>
          </div>
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-56 overflow-visible">
            {/* Grid Lines */}
            {[0, 0.25, 0.5, 0.75, 1].map((pct, idx) => {
              const y = padding.top + chartH * (1 - pct);
              return (
                <g key={idx}>
                  <line x1={padding.left} y1={y} x2={width - padding.right} y2={y} stroke="#1e293b" strokeDasharray="3 3" />
                  <text x={padding.left - 8} y={y + 3} fill="#64748b" fontSize="9" textAnchor="end">
                    ${Math.round((maxY * pct) / 1000)}k
                  </text>
                </g>
              );
            })}
            {/* Y1 Line (Revenue) */}
            <polyline fill="none" stroke="#6366f1" strokeWidth="2.5" points={pointsY1} />
            {data.map((d, i) => {
              const x = padding.left + (i / (data.length - 1 || 1)) * chartW;
              const y = padding.top + chartH - ((d[y1Key] || 0) / maxY) * chartH;
              return <circle key={i} cx={x} cy={y} r="3" fill="#6366f1" className="hover:r-5 transition-all cursor-pointer" />;
            })}
            {/* Y2 Line (Profit) */}
            <polyline fill="none" stroke="#10b981" strokeWidth="2.5" points={pointsY2} />
            {/* X Labels */}
            {data.map((d, i) => {
              const x = padding.left + (i / (data.length - 1 || 1)) * chartW;
              return (
                <text key={i} x={x} y={height - 12} fill="#64748b" fontSize="9" textAnchor="middle">
                  {d[xKey]}
                </text>
              );
            })}
          </svg>
        </div>
      );
    };

    const SVGBarChart = ({ data, xKey = 'category', yKey = 'profit', title, subtitle, color = '#6366f1' }) => {
      if (!data || !data.length) return null;
      const maxY = Math.max(...data.map(d => d[yKey] || 0)) * 1.2 || 100;
      const width = 600;
      const height = 220;
      const padding = { top: 20, right: 30, bottom: 40, left: 60 };
      const chartW = width - padding.left - padding.right;
      const chartH = height - padding.top - padding.bottom;
      const barW = Math.min(40, chartW / data.length - 12);

      return (
        <div className="bg-[#0f172a] border border-slate-800/80 rounded-xl p-5 shadow-sm">
          <div className="mb-2">
            <h3 className="text-sm font-bold text-white">{title}</h3>
            {subtitle && <p className="text-xs text-slate-400">{subtitle}</p>}
          </div>
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-56 overflow-visible">
            {[0, 0.33, 0.66, 1].map((pct, idx) => {
              const y = padding.top + chartH * (1 - pct);
              return (
                <g key={idx}>
                  <line x1={padding.left} y1={y} x2={width - padding.right} y2={y} stroke="#1e293b" strokeDasharray="3 3" />
                  <text x={padding.left - 8} y={y + 3} fill="#64748b" fontSize="9" textAnchor="end">
                    ${Math.round((maxY * pct) / 1000)}k
                  </text>
                </g>
              );
            })}
            {data.map((d, i) => {
              const x = padding.left + i * (chartW / data.length) + (chartW / data.length - barW) / 2;
              const h = ((d[yKey] || 0) / maxY) * chartH;
              const y = padding.top + chartH - h;
              return (
                <g key={i} className="group cursor-pointer">
                  <rect x={x} y={y} width={barW} height={h} fill={color} rx="4" className="hover:opacity-80 transition" />
                  <text x={x + barW / 2} y={height - 12} fill="#64748b" fontSize="9" textAnchor="middle">
                    {String(d[xKey]).length > 10 ? String(d[xKey]).slice(0, 9) + '…' : String(d[xKey])}
                  </text>
                  <text x={x + barW / 2} y={y - 5} fill="#fff" fontSize="9" textAnchor="middle" opacity="0" className="group-hover:opacity-100 transition">
                    ${Math.round(d[yKey] / 1000)}k
                  </text>
                </g>
              );
            })}
          </svg>
        </div>
      );
    };

    const SVGPieChart = ({ data, title, subtitle }) => {
      if (!data || !data.length) return null;
      const total = data.reduce((sum, d) => sum + (d.value || 0), 0) || 1;
      const colors = ['#6366f1', '#06b6d4', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6'];
      let cumulativeAngle = 0;

      const slices = data.map((d, i) => {
        const val = d.value || 0;
        const angle = (val / total) * 360;
        const start = cumulativeAngle;
        cumulativeAngle += angle;
        const end = cumulativeAngle;

        const x1 = 100 + 75 * Math.cos((Math.PI * (start - 90)) / 180);
        const y1 = 100 + 75 * Math.sin((Math.PI * (start - 90)) / 180);
        const x2 = 100 + 75 * Math.cos((Math.PI * (end - 90)) / 180);
        const y2 = 100 + 75 * Math.sin((Math.PI * (end - 90)) / 180);
        const largeArc = angle > 180 ? 1 : 0;
        const pathData = `M 100 100 L ${x1} ${y1} A 75 75 0 ${largeArc} 1 ${x2} ${y2} Z`;

        return { ...d, pathData, color: colors[i % colors.length], pct: ((val / total) * 100).toFixed(1) };
      });

      return (
        <div className="bg-[#0f172a] border border-slate-800/80 rounded-xl p-5 shadow-sm">
          <div className="mb-2">
            <h3 className="text-sm font-bold text-white">{title}</h3>
            {subtitle && <p className="text-xs text-slate-400">{subtitle}</p>}
          </div>
          <div className="flex flex-col sm:flex-row items-center justify-center gap-6 pt-2">
            <svg viewBox="0 0 200 200" className="w-44 h-44">
              {slices.map((s, i) => (
                <path key={i} d={s.pathData} fill={s.color} className="hover:opacity-80 transition cursor-pointer" />
              ))}
              <circle cx="100" cy="100" r="45" fill="#0f172a" />
            </svg>
            <div className="space-y-1.5 text-xs">
              {slices.map((s, i) => (
                <div key={i} className="flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: s.color }} />
                  <span className="text-slate-300 font-medium">{s.name}:</span>
                  <span className="font-bold text-white">{s.pct}%</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // Main App Component
    function App() {
      const [activeTab, setActiveTab] = useState('overview');
      const [datasets, setDatasets] = useState([]);
      const [activeDataset, setActiveDataset] = useState(null);
      const [overview, setOverview] = useState(null);
      const [charts, setCharts] = useState(null);
      const [filters, setFilters] = useState({});
      const [isLoading, setIsLoading] = useState(true);

      // AI Chat State
      const [chatMessages, setChatMessages] = useState([]);
      const [chatInput, setChatInput] = useState('');
      const [isThinking, setIsThinking] = useState(false);
      const [conversationId, setConversationId] = useState(null);

      // Anomaly State
      const [anomalyData, setAnomalyData] = useState(null);
      const [anomalyMethod, setAnomalyMethod] = useState('isolation_forest');

      // Forecasting State
      const [forecastData, setForecastData] = useState(null);
      const [forecastHorizon, setForecastHorizon] = useState(30);
      const [forecastMethod, setForecastMethod] = useState('linear');

      // Reports State
      const [reportsList, setReportsList] = useState([]);
      const [reportType, setReportType] = useState('executive_summary');
      const [reportFormat, setReportFormat] = useState('pdf');
      const [isGeneratingReport, setIsGeneratingReport] = useState(false);
      const [generatedReport, setGeneratedReport] = useState(null);

      // Data Explorer State
      const [explorerData, setExplorerData] = useState(null);
      const [explorerPage, setExplorerPage] = useState(1);
      const [explorerSearch, setExplorerSearch] = useState('');

      // Cleaning State
      const [cleaningPreview, setCleaningPreview] = useState(null);
      const [cleaningSuccess, setCleaningSuccess] = useState(null);

      // EDA State
      const [edaStats, setEdaStats] = useState(null);
      const [edaCorrelations, setEdaCorrelations] = useState(null);

      const refreshDatasets = async () => {
        try {
          const res = await fetch(`${API_BASE}/datasets`);
          if (res.ok) {
            const list = await res.json();
            setDatasets(list);
            const active = list.find(d => d.is_active) || list[0] || null;
            setActiveDataset(active);
          }
        } catch (e) {
          console.error("Dataset fetch failed:", e);
        }
      };

      useEffect(() => {
        refreshDatasets();
      }, []);

      // Load Overview & Charts whenever active dataset or filters change
      useEffect(() => {
        if (!activeDataset) return;
        const load = async () => {
          setIsLoading(true);
          try {
            const params = new URLSearchParams();
            if (filters.start_date) params.append('start_date', filters.start_date);
            if (filters.end_date) params.append('end_date', filters.end_date);
            filters.category?.forEach(c => params.append('category', c));
            filters.region?.forEach(r => params.append('region', r));

            const [ovRes, chRes] = await Promise.all([
              fetch(`${API_BASE}/analysis/${activeDataset.id}/overview?${params.toString()}`),
              fetch(`${API_BASE}/analysis/${activeDataset.id}/charts?${params.toString()}`)
            ]);
            if (ovRes.ok) setOverview(await ovRes.json());
            if (chRes.ok) setCharts(await chRes.json());
          } catch (e) {
            console.error("Analysis load error:", e);
          } finally {
            setIsLoading(false);
          }
        };
        load();
      }, [activeDataset, filters]);

      // Load Tab-specific data
      useEffect(() => {
        if (!activeDataset) return;

        if (activeTab === 'explorer') {
          fetch(`${API_BASE}/datasets/${activeDataset.id}?page=${explorerPage}&page_size=20&search=${encodeURIComponent(explorerSearch)}`)
            .then(r => r.json())
            .then(setExplorerData);
        } else if (activeTab === 'cleaning') {
          fetch(`${API_BASE}/cleaning/${activeDataset.id}/preview`, { method: 'POST' })
            .then(r => r.json())
            .then(setCleaningPreview);
        } else if (activeTab === 'eda') {
          fetch(`${API_BASE}/analysis/${activeDataset.id}/statistics`)
            .then(r => r.json())
            .then(setEdaStats);
          fetch(`${API_BASE}/analysis/${activeDataset.id}/correlations`)
            .then(r => r.json())
            .then(setEdaCorrelations);
        } else if (activeTab === 'anomaly') {
          fetch(`${API_BASE}/anomaly/${activeDataset.id}/detect`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ method: anomalyMethod })
          }).then(r => r.json()).then(setAnomalyData);
        } else if (activeTab === 'forecasting') {
          fetch(`${API_BASE}/forecast/${activeDataset.id}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ horizon_days: forecastHorizon, method: forecastMethod })
          }).then(r => r.json()).then(setForecastData);
        } else if (activeTab === 'reports') {
          fetch(`${API_BASE}/reports`).then(r => r.json()).then(setReportsList);
        } else if (activeTab === 'ai' && chatMessages.length === 0) {
          setChatMessages([{
            id: 1,
            role: 'assistant',
            content: `Hello! I am your InsightIQ AI Data Analyst connected to **${activeDataset.filename}** (${activeDataset.row_count.toLocaleString()} records). Ask me about total revenue, profit margins, regional comparisons, product rankings, or trend trajectories. Every number is mathematically calculated.`,
            follow_ups: ['What is the total revenue and profit margin?', 'Which product generated the highest profit?', 'Compare regional performance', 'What are monthly sales trends?']
          }]);
        }
      }, [activeTab, activeDataset, explorerPage, explorerSearch, anomalyMethod, forecastHorizon, forecastMethod]);

      // AI Chat Send
      const handleSendMessage = async (text) => {
        const q = text || chatInput;
        if (!q.trim() || !activeDataset || isThinking) return;
        setChatMessages(prev => [...prev, { id: Date.now(), role: 'user', content: q }]);
        setChatInput('');
        setIsThinking(true);

        try {
          const res = await fetch(`${API_BASE}/ai/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ dataset_id: activeDataset.id, message: q, conversation_id: conversationId })
          });
          if (res.ok) {
            const data = await res.json();
            setConversationId(data.conversation_id);
            setChatMessages(prev => [...prev, {
              id: Date.now() + 1,
              role: 'assistant',
              content: data.answer,
              plan: data.query_plan,
              chart: data.chart_recommendation,
              follow_ups: data.suggested_follow_ups
            }]);
          }
        } catch (e) {
          console.error("Chat error:", e);
        } finally {
          setIsThinking(false);
        }
      };

      // Apply Cleaning
      const handleApplyCleaning = async () => {
        if (!activeDataset) return;
        try {
          const res = await fetch(`${API_BASE}/cleaning/${activeDataset.id}/apply`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ remove_duplicates: true, fill_numerical: 'mean', fill_categorical: 'mode' })
          });
          if (res.ok) {
            const data = await res.json();
            setCleaningSuccess(data);
            await refreshDatasets();
          }
        } catch (e) {
          console.error("Cleaning error:", e);
        }
      };

      // Generate Report
      const handleGenerateReport = async () => {
        if (!activeDataset) return;
        setIsGeneratingReport(true);
        try {
          const res = await fetch(`${API_BASE}/reports/generate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ dataset_id: activeDataset.id, report_type: reportType, format: reportFormat })
          });
          if (res.ok) {
            const data = await res.json();
            setGeneratedReport(data);
            const listRes = await fetch(`${API_BASE}/reports`);
            if (listRes.ok) setReportsList(await listRes.json());
          }
        } catch (e) {
          console.error("Report generation error:", e);
        } finally {
          setIsGeneratingReport(false);
        }
      };

      const selectDataset = async (id) => {
        await fetch(`${API_BASE}/datasets/${id}/select`, { method: 'POST' });
        await refreshDatasets();
      };

      return (
        <div className="flex h-screen overflow-hidden bg-[#090d16]">
          {/* Sidebar */}
          <aside className="w-64 bg-[#090d16] border-r border-slate-800/80 flex flex-col h-screen select-none shrink-0">
            <div className="h-16 flex items-center px-6 border-b border-slate-800/80 gap-3">
              <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-cyan-400 flex items-center justify-center shadow-lg shadow-indigo-500/20 font-black text-white text-base">
                IQ
              </div>
              <div>
                <span className="font-bold text-base tracking-tight text-white flex items-center gap-1.5">
                  InsightIQ
                  <span className="text-[10px] font-semibold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-1.5 py-0.5 rounded">v1.0</span>
                </span>
                <p className="text-[11px] text-slate-400 font-medium">Enterprise AI Analytics</p>
              </div>
            </div>

            {/* Active Dataset Pill */}
            <div className="p-3 mx-3 my-3 rounded-lg bg-slate-900/60 border border-slate-800/80">
              <div className="flex items-center justify-between text-xs text-slate-400 mb-1">
                <span className="font-medium text-slate-400">Active Dataset</span>
                <span className="text-[10px] text-emerald-400 font-bold">● Live</span>
              </div>
              <p className="text-xs font-bold text-slate-200 truncate">{activeDataset?.filename || 'No dataset'}</p>
              {activeDataset && (
                <p className="text-[11px] text-slate-400 mt-1">
                  {activeDataset.row_count.toLocaleString()} rows • {activeDataset.column_count} cols
                  {activeDataset.is_cleaned ? ' • Cleaned' : ''}
                </p>
              )}
            </div>

            {/* Navigation */}
            <nav className="flex-1 px-3 space-y-1 overflow-y-auto">
              {[
                { id: 'overview', label: 'Overview', icon: '📊' },
                { id: 'upload', label: 'Data Upload', icon: '☁️', badge: datasets.length },
                { id: 'explorer', label: 'Data Explorer', icon: '🗂️' },
                { id: 'cleaning', label: 'Automated Cleaning', icon: '✨' },
                { id: 'eda', label: 'Exploratory EDA', icon: '📈' },
                { id: 'dashboard', label: 'BI Dashboard', icon: '🖥️' },
                { id: 'ai', label: 'AI Data Analyst', icon: '🤖', ai: true },
                { id: 'anomaly', label: 'Anomaly Detection', icon: '⚠️' },
                { id: 'forecasting', label: 'Forecasting', icon: '🔮' },
                { id: 'reports', label: 'Business Reports', icon: '📑' },
                { id: 'settings', label: 'Settings', icon: '⚙️' },
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`w-full flex items-center gap-3 px-3 py-2 rounded-md text-xs font-medium transition ${
                    activeTab === item.id
                      ? 'bg-indigo-600 text-white shadow-sm shadow-indigo-600/30'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                  }`}
                >
                  <span>{item.icon}</span>
                  <span className="flex-1 text-left">{item.label}</span>
                  {item.badge !== undefined && (
                    <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-slate-800 text-slate-300 font-semibold">{item.badge}</span>
                  )}
                  {item.ai && (
                    <span className="text-[9px] px-1.5 py-0.5 rounded font-bold uppercase bg-gradient-to-r from-indigo-500 to-cyan-500 text-white">AI</span>
                  )}
                </button>
              ))}
            </nav>

            <div className="p-3 border-t border-slate-800/80 text-[11px] text-slate-400 flex items-center justify-between">
              <span className="flex items-center gap-1.5 text-emerald-400 font-medium">● REST API 8000</span>
              <span className="text-slate-400">Postgres / SQLite</span>
            </div>
          </aside>

          {/* Main Content Area */}
          <div className="flex-1 flex flex-col h-screen overflow-hidden">
            {/* Header */}
            <header className="h-16 bg-[#090d16] border-b border-slate-800/80 px-8 flex items-center justify-between shrink-0">
              <div>
                <h1 className="text-base font-bold text-white capitalize">{activeTab.replace('_', ' ')}</h1>
                <p className="text-[11px] text-slate-400">InsightIQ Business Intelligence Platform</p>
              </div>
              <div className="flex items-center gap-3">
                {datasets.length > 0 && (
                  <select
                    value={activeDataset?.id || ''}
                    onChange={(e) => selectDataset(Number(e.target.value))}
                    className="bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 outline-none cursor-pointer"
                  >
                    {datasets.map(d => (
                      <option key={d.id} value={d.id}>{d.filename} {d.is_cleaned ? '(Cleaned)' : ''}</option>
                    ))}
                  </select>
                )}
                <div className="px-2.5 py-1 rounded-full bg-indigo-950/60 border border-indigo-800/50 text-[11px] text-indigo-300 font-medium flex items-center gap-1.5">

                    </div>
                  </div>

                  {generatedReport && (
                    <div className="bg-slate-900 border border-indigo-800/40 p-5 rounded-xl text-xs space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="text-emerald-400 font-bold">Report Ready!</span>
                        <a href={generatedReport.download_url} download className="px-3 py-1 bg-emerald-600 text-white font-bold rounded">
                          Download {generatedReport.file_format.toUpperCase()}
                        </a>
                      </div>
                      <p className="text-slate-300 leading-relaxed">{generatedReport.summary_text}</p>
                    </div>
                  )}

                  <div className="bg-[#0f172a] border border-slate-800 rounded-xl p-5">
                    <h4 className="text-sm font-bold text-white mb-3">Saved Reports ({reportsList.length})</h4>
                    <div className="divide-y divide-slate-800 text-xs">
                      {reportsList.map(r => (
                        <div key={r.id} className="py-2.5 flex items-center justify-between">
                          <div>
                            <span className="font-bold text-white">{r.title}</span>
                            <span className="ml-2 text-slate-400 uppercase text-[10px]">({r.file_format})</span>
                          </div>
                          <a href={r.download_url} download className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-indigo-300 rounded">
                            Download
                          </a>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* VIEW 11: SETTINGS */}
              {activeTab === 'settings' && (
                <div className="bg-[#0f172a] border border-slate-800 rounded-xl p-6 max-w-2xl space-y-4 text-xs">
                  <h3 className="text-base font-bold text-white">System Architecture & Settings</h3>
                  <div className="space-y-3">
                    <div className="bg-slate-900 p-3.5 rounded-lg border border-slate-800">
                      <span className="text-slate-400 font-semibold block mb-1">Anthropic Claude API Configuration:</span>
                      <p className="text-slate-300">Set <code className="bg-slate-800 px-1.5 py-0.5 rounded text-indigo-300">ANTHROPIC_API_KEY</code> in environment or <code className="bg-slate-800 px-1.5 py-0.5 rounded text-indigo-300">backend/.env.example</code>.</p>
                      <p className="text-slate-400 mt-1">If not set, InsightIQ runs with deterministic Pandas/NumPy computational verifier ensuring 0 hallucinations.</p>
                    </div>
                    <div className="bg-slate-900 p-3.5 rounded-lg border border-slate-800">
                      <span className="text-slate-400 font-semibold block mb-1">Database & Storage:</span>
                      <p className="text-slate-300">SQLite persistence: <code className="text-indigo-300">insightiq.db</code></p>
                      <p className="text-slate-300">Datasets directory: <code className="text-indigo-300">storage/datasets/</code></p>
                      <p className="text-slate-300">Reports directory: <code className="text-indigo-300">storage/reports/</code></p>
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
